<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ═══════════════════════════════════════════════════
       CRITICAL CSS — inlined, zero render-blocking
  ═══════════════════════════════════════════════════ -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#040404;color:#fff;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh;background:#040404}
    /* Prevent FOUC on hero — placeholder until React mounts */
    #root:empty::before{
      content:'';display:block;height:100vh;
      background:linear-gradient(135deg,#0a0a0a 0%,#111 100%);
    }
  </style>

  <!-- ═══════════════════════════════════════════════════
       PRECONNECTS — must come before any external fetch
       crossorigin is REQUIRED on image CDN so the TLS
       handshake is reused for actual <img> fetches
  ═══════════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://api.themoviedb.org" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="dns-prefetch" href="https://static.cloudflareinsights.com" />

  <!-- ═══════════════════════════════════════════════════
       TRENDING API PREFETCH
       Fires during HTML parse — before React bundle even
       downloads. Result cached in window.__trendingPrefetch
       so HomePage.js consumes it instantly with zero extra
       network request. Uses VITE_API_URL injected by Vite.
  ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      var base = '%VITE_API_URL%';
      if (!base || base === '%VITE_API_URL%') return;
      window.__trendingPrefetch = fetch(base + '/movies/trending', {
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json' }
      })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════
       LCP IMAGE PRELOAD SLOT
       • href left empty — filled by React as soon as
         movies[0] is available (see HeroSlider / App)
       • fetchpriority="high" tells the browser this is
         the most important asset on the page
       • imagesizes / imagesrcset can be added too for
         responsive preload if needed
  ═══════════════════════════════════════════════════ -->
  <link
    rel="preload"
    as="image"
    id="lcp-hero-preload"
    fetchpriority="high"
    importance="high"
    href=""
  />

  <!-- ═══════════════════════════════════════════════════
       MOBILE LCP IMAGE PRELOAD SLOT
       • Separate slot for mobile poster (portrait image)
       • media query ensures only mobile devices use it
       • href filled by React same time as desktop slot
  ═══════════════════════════════════════════════════ -->
  <link
    rel="preload"
    as="image"
    id="lcp-hero-preload-mobile"
    fetchpriority="high"
    importance="high"
    media="(max-width: 480px)"
    href=""
  />

  <!-- ═══════════════════════════════════════════════════
       FONTS — all 7 families are actively used across
       the codebase (Navbar, Footer, WatchMovieModal,
       Dashboard, PublicHome etc). Non-blocking via
       preload + onload swap. display=swap prevents
       invisible text during load.
  ═══════════════════════════════════════════════════ -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
    />
  </noscript>

  <!-- ═══════════════════════════════════════════════════
       SEO
  ═══════════════════════════════════════════════════ -->
  <title>StreamHub — Watch Movies Online Free | Stream Latest Films</title>
  <meta name="description" content="StreamHub lets you watch movies online free. Stream the latest Hollywood films and world cinema with AI-powered recommendations." />
  <meta name="keywords" content="watch movies online free, stream movies free, latest movies 2025" />
  <meta name="author" content="StreamHub" />
  <link rel="canonical" href="https://stream1hub.pages.dev/" />

  <!-- ═══════════════════════════════════════════════════
       FAVICON
  ═══════════════════════════════════════════════════ -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- ═══════════════════════════════════════════════════
       OPEN GRAPH
  ═══════════════════════════════════════════════════ -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="StreamHub — Watch Movies Online Free" />
  <meta property="og:description" content="Watch latest movies online free." />
  <meta property="og:image" content="https://stream1hub.pages.dev/og-image.jpg" />
  <meta property="og:url" content="https://stream1hub.pages.dev/" />

  <!-- ═══════════════════════════════════════════════════
       TWITTER CARD
  ═══════════════════════════════════════════════════ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="StreamHub — Watch Movies Online Free" />
  <meta name="twitter:description" content="Stream movies online free." />
  <meta name="twitter:image" content="https://stream1hub.pages.dev/og-image.jpg" />

  <!-- ═══════════════════════════════════════════════════
       JSON-LD STRUCTURED DATA
  ═══════════════════════════════════════════════════ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "StreamHub",
    "url": "https://stream1hub.pages.dev",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://stream1hub.pages.dev/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ═══════════════════════════════════════════════════
       MODULE PRELOAD — tells browser to fetch + parse
       the Vite entry bundle earlier, so React mounts
       sooner and the TMDB API call starts sooner,
       which means the LCP image URL is known sooner.
  ═══════════════════════════════════════════════════ -->
  <link rel="modulepreload" href="/src/index.js" />

</head>

<body>

  <!-- GTM noscript fallback -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-TRKN2KNM"
      height="0" width="0"
      style="display:none;visibility:hidden">
    </iframe>
  </noscript>

  <!-- App root -->
  <div id="root"></div>

  <!-- ═══════════════════════════════════════════════════
       GTM — deferred until first real user interaction.
       Bots, prerender, and instant bounces never
       download it. dataLayer initialized early so no
       events are lost before GTM loads.
  ═══════════════════════════════════════════════════ -->
  <script>
    window.dataLayer = window.dataLayer || [];

    function loadGTM() {
      if (window._gtmLoaded) return;
      window._gtmLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-TRKN2KNM';
      s.async = true;
      document.body.appendChild(s);
    }

    ['click', 'scroll', 'keydown', 'touchstart'].forEach(function(e) {
      document.addEventListener(e, loadGTM, { once: true, passive: true });
    });
  </script>

  <!-- Cloudflare Web Analytics — defer so it never blocks anything -->
  <script
    defer
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"a53ff023fe3c4a49b77ee6dd02d4b8ef"}'>
  </script>

  <!-- Vite entry point -->
  <script type="module" src="/src/index.js"></script>

</body>
</html>
