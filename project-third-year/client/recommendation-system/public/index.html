<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <title>StreamHub — Watch Movies Online Free | Stream Latest Films</title>
  <meta name="description" content="StreamHub lets you watch movies online free. Stream the latest Hollywood films and world cinema with AI-powered recommendations." />
  <meta name="keywords" content="watch movies online free, stream movies free, latest movies 2025" />
  <meta name="author" content="StreamHub" />
  <link rel="canonical" href="https://stream1hub.pages.dev/home" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="StreamHub — Watch Movies Online Free" />
  <meta property="og:description" content="Watch latest movies online free." />
  <meta property="og:image" content="https://stream1hub.pages.dev/og-image.jpg" />
  <meta property="og:url" content="https://stream1hub.pages.dev/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="StreamHub — Watch Movies Online Free" />
  <meta name="twitter:description" content="Stream movies online free." />
  <meta name="twitter:image" content="https://stream1hub.pages.dev/og-image.jpg" />

  <!-- JSON-LD structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "StreamHub",
    "url": "https://stream1hub.pages.dev",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://stream1hub.pages.dev/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Critical CSS — inlined to eliminate render-blocking -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
    #root{min-height:100vh;background:#000}
    /* Skeleton loader — prevents layout shift while JS loads */
    #root:empty::after{
      content:'';
      display:block;
      width:100%;
      height:100vh;
      background:#000;
    }
  </style>

  <!-- Preconnect to external origins (order matters: earliest used first) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="dns-prefetch" href="https://static.cloudflareinsights.com" />

  <!--
    Fonts — non-blocking pattern:
    - preload fetches the CSS early without blocking render
    - onload swaps rel to stylesheet once ready
    - noscript fallback for JS-disabled browsers
    - Only loading weights 400+500 (drop 600 if unused, saves ~8kb)
  -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  </noscript>

</head>

<body>

  <!-- GTM noscript fallback — must be first child of body -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-TRKN2KNM"
      height="0" width="0"
      style="display:none;visibility:hidden">
    </iframe>
  </noscript>

  <!-- App root -->
  <div id="root"></div>

  <!--
    GTM — deferred and non-blocking:
    - Waits for 'load' event so it never competes with app JS
    - Extra 3s setTimeout keeps it out of TTI measurement
    - window.dataLayer initialized early so events queued before GTM loads are not lost
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-TRKN2KNM';
        s.async = true;
        document.body.appendChild(s);
      }, 3000);
    });
  </script>

  <!--
    Cloudflare Web Analytics — defer keeps it out of the critical path
    Does not affect Core Web Vitals
  -->
  <script
    defer
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"a53ff023fe3c4a49b77ee6dd02d4b8ef"}'>
  </script>

</body>
</html>
